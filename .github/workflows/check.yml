name: check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify portable operating system
        run: npm run check
      - name: Build qualified A/B resident profile
        run: npm run build -- dist-ab triptych-cpu-v0.1-8m-ab
      - name: Retain qualified default-profile artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-cpm-triptych
          path: |
            dist/ccp.bin
            dist/bdos.bin
            dist/manifest.json
          if-no-files-found: error
      - name: Retain qualified A/B-profile artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-cpm-triptych-8m-ab
          path: |
            dist-ab/ccp.bin
            dist-ab/bdos.bin
            dist-ab/manifest.json
          if-no-files-found: error
